name: lyrics-worker
services:
  worker:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE to a versioned image}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-translategemma:4b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      OLLAMA_MAX_ATTEMPTS: ${OLLAMA_MAX_ATTEMPTS:-3}
    depends_on:
      ollama: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.0}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - type: bind
        source: ${OLLAMA_MODELS_PATH:?Set absolute path to existing Ollama models directory}
        target: /models
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
